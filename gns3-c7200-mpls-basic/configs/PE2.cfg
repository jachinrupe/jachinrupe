! PE2 - Provider Edge 2 (Egress PE)
hostname PE2
no ip domain-lookup

ip cef
mpls label protocol ldp
mpls ldp router-id Loopback0 force

interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 no shutdown

! Core-facing (MPLS ON)
interface FastEthernet0/0
 description TO-P
 ip address 10.0.23.1 255.255.255.0
 mpls ip
 no shutdown

! CE-facing (NO MPLS)
interface FastEthernet1/0
 description TO-CE2
 ip address 10.0.20.2 255.255.255.0
 no shutdown

router ospf 1
 router-id 3.3.3.3
 network 3.3.3.3 0.0.0.0 area 0
 network 10.0.23.0 0.0.0.255 area 0

! Customer reachability (simple static for this basic lab)
ip route 10.0.10.0 255.255.255.0 10.0.23.2

end
write memory
